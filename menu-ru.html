<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu RU</title>
<style>
body{
  margin:0;
  font-family:'Montserrat', sans-serif;
  background: url('bg.jpg') center/cover no-repeat;
  color:white;
}
.header{
  position:fixed;
  top:0;
  width:100%;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  padding:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
}
.logo{
  height:40px;
}
.back{
  position:absolute;
  left:15px;
  text-decoration:none;
  color:white;
  background: rgba(255,255,255,0.1);
  padding:6px 12px;
  border-radius:20px;
}
.menu{
  margin-top:80px;
  padding:20px;
}
.category{
  font-size:18px;
  font-weight:600;
  margin-top:20px;
  margin-bottom:10px;
  border-bottom:1px solid rgba(255,255,255,0.3);
  padding-bottom:5px;
}
.item{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
  font-size:16px;
}
.price{
  font-weight:600;
}
</style>
</head>
<body>

<div class="header">
<a class="back" href="index.html">← Назад</a>
<img src="logo.png" class="logo">
</div>

<div class="menu">

<div class="category">🍔 Бургеры</div>
<div class="item"><span>Чизбургер</span><span class="price">1200 AMD</span></div>
<div class="item"><span>Бекон бургер</span><span class="price">1500 AMD</span></div>

<div class="category">🥗 Салаты</div>
<div class="item"><span>Греческий салат</span><span class="price">900 AMD</span></div>
<div class="item"><span>Цезарь</span><span class="price">1100 AMD</span></div>

<div class="category">🥤 Напитки</div>
<div class="item"><span>Кола 0.5л</span><span class="price">500 AMD</span></div>
<div class="item"><span>Минеральная вода</span><span class="price">400 AMD</span></div>

</div>

</body>
</html>
