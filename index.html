<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Montserrat', sans-serif;
background:url('bg.jpg') center/cover no-repeat;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

body::before{
content:'';
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.65);
backdrop-filter: blur(4px);
}

.box{
position:relative;
backdrop-filter: blur(20px);
background:rgba(255,255,255,0.08);
border-radius:25px;
padding:35px 25px;
width:90%;
max-width:420px;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,0.5);
animation:fadeIn 1s ease;
}

.logo{
width:130px;
margin-bottom:15px;
}

h1{
color:white;
margin-bottom:25px;
font-weight:600;
letter-spacing:1px;
}

.btn{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
text-decoration:none;
color:white;
background:linear-gradient(45deg,#e74c3c,#ff7675);
padding:16px;
margin:12px 0;
border-radius:14px;
font-size:18px;
transition:0.3s;
box-shadow:0 0 15px rgba(231,76,60,0.5);
}

.btn:hover{
transform:scale(1.06);
box-shadow:0 0 25px rgba(231,76,60,0.9);
}

.flag{
font-size:22px;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<div class="box">

<img src="logo.png" class="logo">

<h1>CHOOSE YOUR LAUNGAGE</h1>

<a class="btn" href="https://docs.google.com/document/d/1Gfy-E9GslwMTmewVqumR2ovdaLiQnYOwHO7tSP6FZuk/edit?usp=sharing" target="_blank">
<span class="flag">🇦🇲</span> Հայերեն
</a>

<a class="btn" href="menu-ru.html" target="_blank">
<span class="flag">🇷🇺</span> Русский
</a>

<a class="btn" href="menu-en.pdf" target="_blank">
<span class="flag">🇬🇧</span> English
</a>

</div>

</body>

</html>
