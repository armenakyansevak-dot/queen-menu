<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu RU</title>
<style>
body{
    margin:0;
    font-family: 'Montserrat', sans-serif;
    background:#111;
}
.header{
    position:fixed;
    top:0;
    width:100%;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(12px);
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
}
.logo{
    height:40px;
}
.back{
    position:absolute;
    left:12px;
    color:white;
    text-decoration:none;
    background:rgba(255,255,255,0.1);
    padding:6px 12px;
    border-radius:20px;
}
.pdf-container{
    margin-top:70px;
    height:calc(100vh - 70px);
}
.pdf-container iframe{
    width:100%;
    height:100%;
    border:none;
}
</style>
</head>
<body>

<div class="header">
<a class="back" href="index.html">← Назад</a>
<img src="logo.png" class="logo">
</div>

<div class="pdf-container">
<iframe src="pdfjs/web/viewer.html?file=menu-ru.pdf"></iframe>
</div>

</body>
</html>
